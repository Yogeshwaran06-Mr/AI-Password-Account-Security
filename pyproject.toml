[project]
name = "ai-micro-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask==3.0.3",
    "scikit-learn==1.4.2",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "joblib==1.4.2",
    "bcrypt==4.1.3",
]

[tool.pyrefly]
search_path = [
    "."
]
project_excludes = [
    "**/__pyrefly_virtual__/**",
    "**/inmemory/**"
]
